<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mâm - Personal bill-sharing app with offline VietQR">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F7F8FC">

  <!-- iOS PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mâm">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mâm — Split Bills & VietQR</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F7F8FC;
      overscroll-behavior-y: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #mam-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #F7F8FC;
      transition: opacity 220ms ease-out;
    }

    #mam-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .mam-splash-logo {
      width: 128px;
      height: 128px;
    }
  </style>
</head>
<body>
  <div id="mam-splash" role="status" aria-label="Mâm">
    <svg class="mam-splash-logo" xmlns="http://www.w3.org/2000/svg" viewBox="188 168 670 670" aria-hidden="true">
      <defs>
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#72ADFF"/>
          <stop offset="100%" stop-color="#3E7EF5"/>
        </linearGradient>
        <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#69E3B6"/>
          <stop offset="100%" stop-color="#2AC28B"/>
        </linearGradient>
        <linearGradient id="butterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFD66B"/>
          <stop offset="100%" stop-color="#F79E38"/>
        </linearGradient>
      </defs>
      <g>
        <path d="M 795.64 600.68 A 304.00 304.00 0 0 1 208.36 600.68 L 372.57 556.68 A 134.00 134.00 0 0 0 631.43 556.68 Z" fill="url(#skyGrad)"/>
        <path d="M 198.42 537.91 A 304.00 304.00 0 0 1 486.09 218.42 L 494.99 388.18 A 134.00 134.00 0 0 0 368.18 529.01 Z" fill="url(#mintGrad)"/>
        <path d="M 602.01 181.59 A 304.00 304.00 0 0 1 847.95 474.69 L 677.98 477.66 A 134.00 134.00 0 0 0 569.57 348.46 Z" fill="url(#butterGrad)"/>
      </g>
    </svg>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('mam-splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () {
        if (splash.parentNode) splash.parentNode.removeChild(splash);
      }, 240);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
